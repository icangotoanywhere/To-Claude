name: Build

# 推到 main：云端编译、用固定密钥签名并核对指纹；app/build.gradle.kts 里的版本号还没发布过，就自动打 tag、发布 Release。
# 版本号没变的推送只编译、不发布。其他分支只编译，安装包在 Actions 的 Artifacts 里。
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 发布密钥证书的 SHA-256（和 EasyClash 同一把密钥）。签出来不是它就不发布，防止误用临时密钥导致用户无法覆盖升级
  RELEASE_CERT_SHA256: ada95c194e88ce73bf7bea727b02a8231496fa96ec87935e50c3860321b5a861

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0' }

      - name: Set up release signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning title=没有发布密钥::仓库 Secrets 里没有 ANDROID_KEYSTORE_B64，本次用临时 debug 签名，只编译、不发布"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$RUNNER_TEMP/keystore.properties"
          echo "TOCLAUDE_KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon > "$RUNNER_TEMP/apk.log" 2>&1 && ok=1 || ok=0
          cat "$RUNNER_TEMP/apk.log"
          if [ "$ok" != 1 ]; then
            echo "::error title=APK 编译失败::$(grep -E '^e: |error:|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/apk.log" | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')"
            exit 1
          fi
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$ver" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "ToClaude-v$ver.apk"

      - name: Verify APK signature
        id: verify
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/certs.txt"
          got=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ "$got" = "$RELEASE_CERT_SHA256" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=APK 已用发布密钥签名::$got"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK 不是发布密钥签名::$got，不会发布"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: toclaude-apk
          path: ToClaude-*.apk

      - name: Release
        if: github.ref == 'refs/heads/main' && steps.verify.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VER"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::notice title=不发布::$tag 已经发布过；要发新版请先改 app/build.gradle.kts 里的版本号"
            exit 0
          fi
          cp "ToClaude-$tag.apk" ToClaude.apk
          notes="release-notes/$tag.md"
          [ -f "$notes" ] || { git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          gh release create "$tag" "ToClaude-$tag.apk" ToClaude.apk --target "$GITHUB_SHA" --title "To Claude $tag" --notes-file "$notes"
